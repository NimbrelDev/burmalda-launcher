<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <g fill="#ea580c">
    <!-- 8 teeth -->
    <rect x="28" y="2" width="8" height="9" rx="1.5"/>
    <rect x="28" y="2" width="8" height="9" rx="1.5" transform="rotate(45 32 32)"/>
    <rect x="28" y="2" width="8" height="9" rx="1.5" transform="rotate(90 32 32)"/>
    <rect x="28" y="2" width="8" height="9" rx="1.5" transform="rotate(135 32 32)"/>
    <rect x="28" y="2" width="8" height="9" rx="1.5" transform="rotate(180 32 32)"/>
    <rect x="28" y="2" width="8" height="9" rx="1.5" transform="rotate(225 32 32)"/>
    <rect x="28" y="2" width="8" height="9" rx="1.5" transform="rotate(270 32 32)"/>
    <rect x="28" y="2" width="8" height="9" rx="1.5" transform="rotate(315 32 32)"/>
    <!-- ring -->
    <circle cx="32" cy="32" r="19" fill="none" stroke="#ea580c" stroke-width="9"/>
  </g>
  <!-- cube in the center (Minecraft, blue) -->
  <polygon points="32,20 42,25 32,30 22,25" fill="#60a5fa"/>
  <polygon points="22,25 32,30 32,42 22,37" fill="#3b82f6"/>
  <polygon points="42,25 42,37 32,42 32,30" fill="#2563eb"/>
</svg>
