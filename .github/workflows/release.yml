# CI/CD: собрать и зарелизить все платформы Burmalda Launcher одним прогоном.
#
# Триггеры:
#   - workflow_dispatch:
#       inputs.version  — версия релиза, указывается БЕЗ префикса "v" (напр. 1.0.0-test).
#                         ВНИМАНИЕ: если указать версию с префиксом "v", созданный тег
#                         совпадёт с паттерном push-триггера 'v*' и запустит второй прогон.
#       inputs.publish  — true: опубликовать Release сразу; false (по умолчанию): Draft.
#   - push тегов 'v*' — версия берётся из имени тега, Release публикуется сразу.
#
# Джобы (параллельно): android (APK из исходников Horizon + мобильный патч),
# linux, windows, macos; затем job release сводит все артефакты в один
# GitHub Release (по умолчанию Draft). Тело релиза — RELEASE_NOTES.md из корня
# репозитория; если файла нет — автогенерация из git log последнего тега.
#
# Примечания:
#   - Android-джоб повторяет логику build-apk.yml (шаги те же), но поиск NDK_ROOT
#     сделан устойчивее: output setup-ndk -> ANDROID_NDK_ROOT/HOME -> папка SDK ->
#     tool cache раннера (/opt/hostedtoolcache/ndk/*/*). Это обходной путь для
#     случая, когда nttld/setup-ndk не выставляет output ndk-root (так упал
#     прогон build-apk #5: NDK скачался в tool cache, а шаг .cargo/config.toml
#     его не нашёл — ошибка окружения, не логики workflow).
#   - Подпись APK: если заданы секреты ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASS /
#     ANDROID_KEY_ALIAS / ANDROID_KEY_PASS — release-ключ, иначе debug-подпись
#     (android/package-apk.sh умеет оба режима через env).
#   - pacman-таргет на ubuntu-latest идёт через fpm, которому нужен bsdtar
#     (пакет libarchive-tools — ставится в джобе). Если pacman всё равно упадёт —
#     джоб автоматически пересобирает остальные таргеты, pacman пропускается
#     (warning), не вали джоб (проверено: в прогоне #2 AppImage/deb/rpm собрались).
#   - rpm: deb/rpm/pacman собираются fpm (бандл electron-builder качает сам);
#     системный rpmbuild не нужен, но пакет `rpm` ставим на всякий случай.
#   - android: android-actions/setup-android@v3 НЕ используется — он запускает
#     `sdkmanager tools`, а этот пакет удалён из репозитория SDK (упал в #2).
#     SDK предустановлен на runner'е; build-tools;34.0.0 и platforms;android-34
#     доустанавливаются напрямую через sdkmanager.
#   - windows: NSIS-таргет на linux требует wine (electron-builder всегда
#     прогоняет инсталлятор под wine для извлечения uninstaller stub) — wine
#     ставится через apt в самой джобе. Иконка/версия в exe патчатся без wine
#     через scripts/afterpack.js (resedit).
#   - Все вызовы electron-builder идут с --publish never: в CI он включает
#     implicit publishing и падает с "GitHub Personal Access Token is not set",
#     т.к. публикация релиза делает job release, а не electron-builder.
#   - macOS: unsigned (identity: null + CSC_IDENTITY_AUTO_DISCOVERY=false),
#     hardenedRuntime не нужен — достаточно для Draft-проверки сборки.
#   - Зависимости ставим pnpm (в репозитории pnpm-lock.yaml, package-lock.json нет —
#     поэтому не `npm ci`), pinned pnpm@11 — та же мажорная, что и локально.

name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия релиза БЕЗ префикса v (например 1.0.0-test)"
        required: true
        type: string
      publish:
        description: "Опубликовать сразу (иначе Draft)"
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  # --- PIN исходников Horizon (тот же, что в build-apk.yml) ---
  HORIZON_COMMIT: "7c839665283157c1ada904d2a10867e52e3443b3"
  HORIZON_REPO: "horizon-rust/horizon"
  # API-эндпоинт ассета релиза engine-base-7c83966 этого же репозитория.
  HORIZON_SOURCE_URL: "https://api.github.com/repos/NimbrelDev/burmalda-launcher/releases/assets/695920018"
  NDK_VERSION: "r26"

jobs:
  # ---------------------------------------------------------------- android ---
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout лаунчера
        uses: actions/checkout@v4

      - name: Вычисляем версию (для имени артефакта)
        run: |
          set -euo pipefail
          V="${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}"
          V="${V#v}"
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"

      - name: Скачиваем и распаковываем исходники Horizon (pin-коммит)
        id: source
        run: |
          set -euo pipefail
          mkdir -p horizon-src && cd horizon-src
          # Прямой URL на source tarball базового коммита. Ассет качаем
          # с GITHUB_TOKEN + Accept: application/octet-stream.
          curl -fL --retry 3 \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/octet-stream" \
            -o horizon-source.tar.gz "${{ env.HORIZON_SOURCE_URL }}"
          tar -xzf horizon-source.tar.gz
          # ВАЖНО: путь в output должен быть АБСОЛЮТНЫМ — последующие шаги
          # стартуют из GITHUB_WORKSPACE, а не из horizon-src (относительный
          # "." сломал патч в прогоне #1: cd "." вёл в корень лаунчера).
          if [ -f Cargo.toml ]; then
            echo "dir=$(pwd)" >> "$GITHUB_OUTPUT"
          else
            D=$(find . -mindepth 2 -name Cargo.toml -printf '%h\n' | head -1)
            echo "dir=$(cd "$D" && pwd)" >> "$GITHUB_OUTPUT"
          fi

      - name: Android NDK ${{ env.NDK_VERSION }}
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: false

      - name: Генерируем .cargo/config.toml под CI-NDK (каскадный поиск NDK_ROOT)
        run: |
          set -euo pipefail
          # 1) output экшена setup-ndk; 2) стандартные переменные окружения;
          # 3) папка SDK; 4) tool cache раннера, куда setup-ndk кладёт NDK.
          NDK_ROOT="${{ steps.ndk.outputs.ndk-root }}"
          : "${NDK_ROOT:=${ANDROID_NDK_ROOT:-${ANDROID_NDK_HOME:-}}}"
          if [ -z "$NDK_ROOT" ] || [ ! -d "$NDK_ROOT" ]; then
            NDK_ROOT=$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | head -1 || true)
          fi
          if [ -z "$NDK_ROOT" ] || [ ! -d "$NDK_ROOT" ]; then
            NDK_ROOT=$(ls -d /opt/hostedtoolcache/ndk/*/* 2>/dev/null | head -1 || true)
          fi
          [ -n "$NDK_ROOT" ] && [ -d "$NDK_ROOT" ] || { echo "::error::NDK not found (ndk-root='${{ steps.ndk.outputs.ndk-root }}', ANDROID_NDK_ROOT='${ANDROID_NDK_ROOT:-}')"; ls /opt/hostedtoolcache/ndk/ 2>/dev/null || true; exit 1; }
          echo "NDK_ROOT=$NDK_ROOT" >> "$GITHUB_ENV"
          echo "Используем NDK: $NDK_ROOT"
          SRC="${{ steps.source.outputs.dir }}"
          mkdir -p "$SRC/.cargo"
          cat > "$SRC/.cargo/config.toml" <<EOF
          [target.aarch64-linux-android]
          ar = "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          linker = "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang"
          rustflags = [
              "-L", "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/34"
          ]
          EOF

      - name: Накладываем мобильный патч (git apply, при неудаче patch -p1)
        run: |
          set -euo pipefail
          cd "${{ steps.source.outputs.dir }}"
          PATCH="$GITHUB_WORKSPACE/android/patches/horizon-mobile-overlay.patch"
          if git apply --check "$PATCH" 2>/dev/null; then
            git apply "$PATCH"
            echo "Патч применён через git apply"
          else
            patch -p1 < "$PATCH"
            echo "Патч применён через patch -p1"
          fi

      - name: Rust stable + target aarch64-linux-android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "${{ steps.source.outputs.dir }}"

      - name: JDK 17 (javac для package-apk.sh)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK (build-tools 34 + platform 34; без android-actions/setup-android)
        # android-actions/setup-android@v3 падает: он запускает `sdkmanager tools`,
        # а устаревший пакет 'tools' удалён из репозитория SDK (Failed to find
        # package 'tools'). SDK уже предустановлен на runner'е — просто ставим
        # недостающие пакеты напрямую и проверяем, что нужны package-apk.sh.
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM=$(ls "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | head -1)
          # Пакеты уже предустановлены на runner'е — sdkmanager выйдет мгновенно,
          # и `yes` получит SIGPIPE (broken pipe), потому пайп под pipefail
          # гасим через || true; корректность проверяет ls ниже.
          if [ ! -f "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt2" ] || [ ! -f "$ANDROID_SDK_ROOT/platforms/android-34/android.jar" ]; then
            yes | "$SDKM" "build-tools;34.0.0" "platforms;android-34" >/dev/null || true
          fi
          ls "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt2" "$ANDROID_SDK_ROOT/platforms/android-34/android.jar"

      - name: cargo build (aarch64-linux-android, release)
        env:
          CC_aarch64_linux_android: ${{ env.NDK_ROOT }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang
          AR_aarch64_linux_android: ${{ env.NDK_ROOT }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
        run: |
          set -euo pipefail
          cd "${{ steps.source.outputs.dir }}"
          # Диагностика: убеждаемся, что патч дошёл до Cargo.toml и android-activity
          # в графе с фичей native-activity (в прогоне #4 CI собрал android-activity
          # БЕЗ backend-фичи и упал на compile_error!, локально тот же граф — ок).
          grep -n "android-activity" crates/horizon-client/Cargo.toml
          cargo tree -i android-activity --target aarch64-linux-android -e features,no-dev | grep -m1 -B1 "android-activity v" || true
          # android-activity/native-activity — явная фиксация backend-фичи через CLI
          # (features транзитивной зависимости), чтобы unification не потерял её.
          cargo build -p horizon-client --target aarch64-linux-android --release \
            --no-default-features --features audio,mods,android-activity/native-activity

      - name: Кладём .so в android/libs/arm64-v8a/
        run: |
          set -euo pipefail
          mkdir -p android/libs/arm64-v8a
          cp "${{ steps.source.outputs.dir }}/target/aarch64-linux-android/release/libhorizon_client.so" \
             android/libs/arm64-v8a/

      - name: Распаковываем release-keystore из секрета (если задан)
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            mkdir -p "$RUNNER_TEMP/keystore"
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/keystore/release.keystore"
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/keystore/release.keystore" >> "$GITHUB_ENV"
          else
            echo "Секрет ANDROID_KEYSTORE_B64 не задан — APK будет подписан debug-ключом"
          fi

      - name: Упаковка APK (android/package-apk.sh)
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: bash android/package-apk.sh

      - name: Переименовываем APK под версию релиза
        run: |
          set -euo pipefail
          cd dist/android
          SRC_APK=$(ls horizon-mobile-*.apk | head -1)
          mv "$SRC_APK" "horizon-mobile-${APP_VERSION}.apk"

      - name: Загружаем APK как артефакт (horizon-mobile-${{ env.APP_VERSION }}.apk)
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/android/horizon-mobile-*.apk
          if-no-files-found: error

  # ------------------------------------------------------------------ linux ---
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Зависимости (pnpm, frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: rpmbuild + bsdtar (fpm использует bsdtar для pacman-таргета)
        run: |
          if ! command -v rpmbuild >/dev/null 2>&1 || ! command -v bsdtar >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y rpm libarchive-tools
          fi

      - name: Сборка linux (AppImage/deb/rpm/pacman; pacman при падении не валит джоб)
        run: |
          set -uo pipefail
          # Таргеты берём из package.json (build.linux.target). ВАЖНО: не передаём
          # таргеты как позиционные аргументы ПОСЛЕ других опций — yargs их не
          # привязывает ("Unknown arguments: AppImage, deb, rpm" в прогоне #1).
          if ! pnpm run build:linux; then
            echo "::warning::Сборка с pacman-таргетом на ubuntu-latest не удалась — пересобираем без него"
            pnpm exec electron-builder --linux AppImage deb rpm --publish never \
              --config.directories.output=dist/linux
          fi

      - name: Артефакты (AppImage/deb/rpm/pacman)
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/linux/*.AppImage
            dist/linux/*.deb
            dist/linux/*.rpm
            dist/linux/*.pacman
          if-no-files-found: error

  # ---------------------------------------------------------------- windows ---
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Зависимости (pnpm, frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Устанавливаем wine (нужен NSIS-таргету на linux)
        # electron-builder 26 на НЕ-Windows хостах всегда прогоняет собираемый
        # инсталлятор под wine, чтобы извлечь uninstaller stub (WineVmManager).
        # Инсталлятор NSIS — 32-битный exe, поэтому нужен и wine32:i386
        # (в прогоне #2 с одним wine64 было "wine process failed 1").
        # Локально сборка работала потому, что wine установлен в системе.
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine wine32:i386 wine64
          wine --version

      - name: Сборка windows (nsis + portable; иконку ставит scripts/afterpack.js через resedit)
        run: pnpm run build:win

      - name: Артефакты (Setup.exe + portable exe)
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/windows/*.exe
          if-no-files-found: error

  # ------------------------------------------------------------------- macos ---
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Зависимости (pnpm, frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Сборка mac (dmg + zip, unsigned)
        env:
          # Нет сертификатов подписи — отключаем автопоиск identity.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: pnpm run build:mac

      - name: Артефакты (dmg + zip)
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/mac/*.dmg
            dist/mac/*.zip
          if-no-files-found: error

  # ----------------------------------------------------------------- release ---
  release:
    needs: [android, linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # полная история для автогенерации notes из git log

      - name: Скачиваем артефакты всех джобов
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Вычисляем тег и draft-статус
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.version }}"
            if [ "${{ inputs.publish }}" = "true" ]; then DRAFT=false; else DRAFT=true; fi
          else
            TAG="${{ github.ref_name }}"   # push тега v* — публикуем сразу
            DRAFT=false
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "draft=$DRAFT" >> "$GITHUB_OUTPUT"

      - name: Формируем тело релиза (RELEASE_NOTES.md или git log последнего тега)
        run: |
          set -euo pipefail
          if [ -f RELEASE_NOTES.md ]; then
            cp RELEASE_NOTES.md body.md
          else
            LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
            {
              echo "## Что нового"
              echo
              if [ -n "$LAST_TAG" ]; then
                git log --oneline "$LAST_TAG..HEAD"
              else
                git log --oneline -20
              fi
            } | sed 's/^/- /' > body.md
          fi

      - name: Создаём Release и заливаем артефакты
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "Burmalda Launcher ${{ steps.meta.outputs.tag }}"
          body_path: body.md
          draft: ${{ steps.meta.outputs.draft }}
          fail_on_unmatched_files: true
          files: release-assets/**
